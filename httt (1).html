<script>
const W=960,H=540;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;

let objects=[],draft=[],nid=1,sel=null,cur=0,total=48,fps=12,bg='#00b140',smooth=true;
let mode='draw',color='#000000',size=6,playing=false,timer=null,drag=null;
let undoS=[],redoS=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(k,v)=>typeof v==='number'?Math.round(v*100)/100:v;

/*PURE*/
function toLocal(t,px,py){const dx=px-t.x,dy=py-t.y,c=Math.cos(-t.r),s=Math.sin(-t.r);return{x:(t.fx||1)*(dx*c-dy*s)/t.s,y:(dx*s+dy*c)/t.s}}
function toWorld(t,lx,ly){const c=Math.cos(t.r),s=Math.sin(t.r);const m=lx*(t.fx||1);return{x:t.x+(m*c-ly*s)*t.s,y:t.y+(m*s+ly*c)*t.s}}
function getT(o,f){
  const ks=Object.keys(o.keys).map(Number).sort((a,b)=>a-b);
  if(f<=ks[0])return o.keys[ks[0]];
  if(f>=ks[ks.length-1])return o.keys[ks[ks.length-1]];
  let i=0;while(ks[i+1]<f)i++;
  const a=ks[i],b=ks[i+1];
  let t=(f-a)/(b-a);if(smooth)t=t*t*(3-2*t);
  const A=o.keys[a],B=o.keys[b];
  return{x:A.x+(B.x-A.x)*t,y:A.y+(B.y-A.y)*t,r:A.r+(B.r-A.r)*t,s:A.s+(B.s-A.s)*t,fx:(t>=1?B:A).fx||1};
}
function getW(o,f,n){
  const l=getT(o,f);
  const own={x:l.x,y:l.y,r:l.r,s:l.s,fx:l.fx||1};
  if(!o.parent||(n||0)>50)return own;
  const P=objects.find(q=>q.id===o.parent);
  if(!P)return own;
  const pw=getW(P,f,(n||0)+1),w=toWorld(pw,l.x,l.y);
  return{x:w.x,y:w.y,r:pw.r+pw.fx*l.r,s:pw.s*l.s,fx:pw.fx};
}
function setWorld(o,f,tw){
  const P=o.parent?objects.find(q=>q.id===o.parent):null;
  if(!P){o.keys[f]={x:tw.x,y:tw.y,r:tw.r,s:tw.s,fx:tw.fx||1};return}
  const pw=getW(P,f),l=toLocal(pw,tw.x,tw.y);
  o.keys[f]={x:l.x,y:l.y,r:(tw.r-pw.r)*pw.fx,s:tw.s/pw.s};
}
function reparent(o,pid){
  const ks=Object.keys(o.keys).map(Number);
  const worlds=ks.map(k=>({...getW(o,k)}));
  o.parent=pid||null;
  const P=pid?objects.find(q=>q.id===pid):null;
  ks.forEach((k,i)=>{
    const w=worlds[i];
    if(!P){o.keys[k]={x:w.x,y:w.y,r:w.r,s:w.s,fx:w.fx||1};return}
    const pw=getW(P,k),l=toLocal(pw,w.x,w.y);
    o.keys[k]={x:l.x,y:l.y,r:(w.r-pw.r)*pw.fx,s:w.s/pw.s};
  });
}
function inChain(anc,id){
  let q=objects.find(x=>x.id===id),n=0;
  while(q&&n++<100){if(q.id===anc.id)return true;const pid=q.parent;q=objects.find(x=>x.id===pid)}
  return false;
}
function setPivot(o,wx,wy){
  const d=toLocal(getW(o,cur),wx,wy);
  for(const st of o.strokes)for(const p of st.pts){p[0]-=d.x;p[1]-=d.y}
  for(const k in o.keys){
    const q=o.keys[k],c=Math.cos(q.r),s=Math.sin(q.r);
    const fq=q.fx||1;q.x+=(fq*d.x*c-d.y*s)*q.s;q.y+=(fq*d.x*s+d.y*c)*q.s;
  }
  for(const c of objects)if(c.parent===o.id)for(const k in c.keys){c.keys[k].x-=d.x;c.keys[k].y-=d.y}
}
function segD(px,py,a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
  let t=l?((px-a[0])*dx+(py-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy);
}
function bbox(o){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(const st of o.strokes){const h=st.size/2;for(const p of st.pts){a=Math.min(a,p[0]-h);b=Math.min(b,p[1]-h);c=Math.max(c,p[0]+h);d=Math.max(d,p[1]+h)}}
  return{x0:a,y0:b,x1:c,y1:d};
}
/*ENDPURE*/

/* ---------- undo / redo ---------- */
function ser(){return JSON.stringify({objects,draft,nid},rnd)}
function restore(s){const d=JSON.parse(s);objects=d.objects;draft=d.draft;nid=d.nid;if(!objects.find(o=>o.id===sel))sel=null}
function pushUndo(){undoS.push(ser());if(undoS.length>30)undoS.shift();redoS=[]}
function afterChange(){updateUI();render();save()}
function doUndo(){if(playing||!undoS.length)return;redoS.push(ser());restore(undoS.pop());afterChange()}
function doRedo(){if(playing||!redoS.length)return;undoS.push(ser());restore(redoS.pop());afterChange()}
function getSel(){return objects.find(o=>o.id===sel)||null}

/* ---------- drawing the scene ---------- */
function drawStroke(g,st){
  g.strokeStyle=g.fillStyle=st.color;g.lineWidth=st.size;g.lineCap='round';g.lineJoin='round';
  const p=st.pts;
  if(st.fill){
    g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();
    g.fillStyle=st.fill;g.fill();if(st.size>0)g.stroke();return;
  }
  if(p.length<2){g.beginPath();g.arc(p[0][0],p[0][1],st.size/2,0,6.2832);g.fill();return}
  g.beginPath();g.moveTo(p[0][0],p[0][1]);
  for(let i=1;i<p.length-1;i++)g.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);
  g.lineTo(p[p.length-1][0],p[p.length-1][1]);g.stroke();
}
function drawObj(g,o,f){
  const t=getW(o,f);
  g.save();g.translate(t.x,t.y);g.rotate(t.r);g.scale((t.fx||1)*t.s,t.s);
  for(const st of o.strokes)drawStroke(g,st);
  g.restore();
}
function uiS(){const w=cv.getBoundingClientRect().width;return w>0?W/w:2.5}
function handlePos(o){
  const t=getW(o,cur),bb=bbox(o),u=uiS();
  const top=toWorld(t,(bb.x0+bb.x1)/2,bb.y0);
  const rot={x:top.x+Math.sin(t.r)*70*u,y:top.y-Math.cos(t.r)*70*u};
  const sc=toWorld(t,bb.x1,bb.y1);
  const corners=[[bb.x0,bb.y0],[bb.x1,bb.y0],[bb.x1,bb.y1],[bb.x0,bb.y1]].map(c=>toWorld(t,c[0],c[1]));
  return{t,top,rot,sc,corners,u};
}
function drawHandles(g){
  const o=getSel();if(!o)return;
  if(rigMode==='pose'&&isRigPart(o)){
    const hh=handlePos(o),uu=hh.u;
    g.save();g.strokeStyle='#fdd835';g.lineWidth=3*uu;
    g.beginPath();g.arc(hh.t.x,hh.t.y,12*uu,0,6.2832);g.stroke();
    g.fillStyle='#e53935';g.beginPath();g.arc(hh.t.x,hh.t.y,4*uu,0,6.2832);g.fill();
    g.restore();return;
  }
  const h=handlePos(o),u=h.u;
  g.save();g.lineWidth=2*u;g.strokeStyle='#4f7cff';g.setLineDash([6*u,4*u]);
  g.beginPath();h.corners.forEach((c,i)=>i?g.lineTo(c.x,c.y):g.moveTo(c.x,c.y));g.closePath();g.stroke();
  g.setLineDash([]);
  g.beginPath();g.moveTo(h.top.x,h.top.y);g.lineTo(h.rot.x,h.rot.y);g.stroke();
  g.fillStyle='#4f7cff';
  g.beginPath();g.arc(h.rot.x,h.rot.y,14*u,0,6.2832);g.fill();
  g.fillRect(h.sc.x-12*u,h.sc.y-12*u,24*u,24*u);
  g.strokeStyle='#e53935';g.lineWidth=3*u;
  g.beginPath();g.moveTo(h.t.x-12*u,h.t.y);g.lineTo(h.t.x+12*u,h.t.y);g.moveTo(h.t.x,h.t.y-12*u);g.lineTo(h.t.x,h.t.y+12*u);g.stroke();
  if(o.parent){
    const P=objects.find(q=>q.id===o.parent);
    if(P){
      const pw=getW(P,cur);
      g.strokeStyle='#fdd835';g.lineWidth=2*u;g.setLineDash([6*u,4*u]);
      g.beginPath();g.moveTo(h.t.x,h.t.y);g.lineTo(pw.x,pw.y);g.stroke();
      g.setLineDash([]);g.beginPath();g.arc(pw.x,pw.y,9*u,0,6.2832);g.stroke();
    }
  }
  g.restore();
}
function drawScene(g,f,ui){
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  for(const o of objects)drawObj(g,o,f);
  if(ui&&!playing){
    for(const st of draft)drawStroke(g,st);
    if(mode==='move'||mode==='pivot')drawHandles(g);
  }
}
function render(){drawScene(ctx,cur,true)}

/* ---------- hit tests ---------- */
function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function hitObj(p){
  const u=uiS(),tol=18*u;let best=null,bd=1e9;
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i],t=getW(o,cur),l=toLocal(t,p.x,p.y);
    let d=1e9;
    for(const st of o.strokes){
      const pts=st.pts,h=st.size/2;
      if(pts.length===1)d=Math.min(d,Math.hypot(l.x-pts[0][0],l.y-pts[0][1])-h);
      else{
        for(let j=0;j<pts.length-1;j++)d=Math.min(d,segD(l.x,l.y,pts[j],pts[j+1])-h);
        if(st.fill&&inPoly(l.x,l.y,pts))d=Math.min(d,8/t.s);
      }
    }
    d*=t.s;
    if(d<=tol&&d<bd-1){bd=d;best=o}
  }
  if(best)return best;
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i],t=getW(o,cur),l=toLocal(t,p.x,p.y),bb=bbox(o);
    const area=(bb.x1-bb.x0)*(bb.y1-bb.y0)*t.s*t.s;
    if(area<0.4*W*H&&l.x>=bb.x0&&l.x<=bb.x1&&l.y>=bb.y0&&l.y<=bb.y1)return o;
  }
  return null;
}
function eraseAt(p){
  const r=Math.max(size,8)*1.5+6*uiS();
  const keep=draft.filter(st=>!st.pts.some((q,i)=>Math.hypot(p.x-q[0],p.y-q[1])<=r+st.size/2||(i<st.pts.length-1&&segD(p.x,p.y,q,st.pts[i+1])<=r+st.size/2)));
  if(keep.length!==draft.length){
    if(!drag.pushed){pushUndo();drag.pushed=true}
    draft=keep;render();updateUI();
  }
}

/* ---------- pointer events ---------- */
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{
  if(playing||ptrs.size>1)return;
  e.preventDefault();cv.setPointerCapture(e.pointerId);
  const p=pt(e);
  if(mode==='draw'){
    pushUndo();
    const st={pts:[[p.x,p.y]],color,size};draft.push(st);
    drag={type:'draw',st,last:p};render();updateUI();
  }else if(mode==='eraser'){
    drag={type:'erase',pushed:false};eraseAt(p);
  }else if(mode==='move'){
    const o=getSel();
    if(o&&!(rigMode==='pose'&&isRigPart(o))){
      const h=handlePos(o),u=h.u;
      if(Math.hypot(p.x-h.rot.x,p.y-h.rot.y)<=26*u){
        drag={type:'rot',o,t0:{...h.t},p0:p,a0:Math.atan2(p.y-h.t.y,p.x-h.t.x),pushed:false};return;
      }
      if(Math.hypot(p.x-h.sc.x,p.y-h.sc.y)<=20*u){
        drag={type:'scale',o,t0:{...h.t},p0:p,d0:Math.hypot(p.x-h.t.x,p.y-h.t.y)||1,pushed:false};return;
      }
    }
    const hit=hitObj(p);
    if(hit){
      const tgt=(hit.rig&&rigMode==='move')?rootOf(hit):hit;
      sel=tgt.id;const t0={...getW(tgt,cur)};
      if(rigMode==='pose'&&isRigPart(tgt))drag={type:'rot',o:tgt,t0,p0:p,a0:Math.atan2(p.y-t0.y,p.x-t0.x),pushed:false};
      else drag={type:'move',o:tgt,t0,p0:p,pushed:false};
    }
    else{sel=null;drag=null}
    updateUI();render();
  }else if(mode==='pivot'){
    const o=getSel();
    if(!o){const hit=hitObj(p);if(hit){sel=hit.id;updateUI();render()}return}
    pushUndo();setPivot(o,p.x,p.y);setMode('move');afterChange();
  }else if(mode==='link'){
    const child=getSel(),hit=hitObj(p);
    if(!child||!hit||hit.id===child.id){setMode('move');return}
    if(inChain(child,hit.id)){alert('Ye loop ban jayega, is object ko parent nahi bana sakte.');setMode('move');return}
    pushUndo();reparent(child,hit.id);setMode('move');afterChange();
  }
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  e.preventDefault();
  const p=pt(e);
  if(drag.type==='draw'){
    const l=drag.last;if(Math.hypot(p.x-l.x,p.y-l.y)<1.5)return;
    drag.st.pts.push([p.x,p.y]);drag.last=p;render();
  }else if(drag.type==='erase'){
    eraseAt(p);
  }else{
    if(!drag.pushed&&Math.hypot(p.x-drag.p0.x,p.y-drag.p0.y)<3*uiS())return;
    const o=drag.o,t0=drag.t0;let t;
    if(drag.type==='move')t={...t0,x:t0.x+p.x-drag.p0.x,y:t0.y+p.y-drag.p0.y};
    else if(drag.type==='rot')t={...t0,r:t0.r+Math.atan2(p.y-t0.y,p.x-t0.x)-drag.a0};
    else t={...t0,s:Math.max(.05,Math.min(30,t0.s*(Math.hypot(p.x-t0.x,p.y-t0.y)/drag.d0)))};
    if(!drag.pushed){pushUndo();drag.pushed=true}
    setWorld(o,cur,t);
    render();updateUI();
  }
});

$('bGroup').onclick=()=>{
  if(!draft.length)return;
  pushUndo();
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(const st of draft)for(const p of st.pts){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1])}
  const cx=(a+c)/2,cy=(b+d)/2;
  const o={id:nid++,strokes:draft.map(st=>({color:st.color,size:st.size,pts:st.pts.map(p=>[p[0]-cx,p[1]-cy])})),keys:{},parent:null};
  o.keys[cur]={x:cx,y:cy,r:0,s:1};
  objects.push(o);draft=[];sel=o.id;
  setMode('move');afterChange();
};
$('bCopy').onclick=()=>{
  const o=getSel();if(!o)return;
  pushUndo();
  const grp=objects.filter(x=>x===o||(x.rig&&inChain(o,x.id)));
  const map={};grp.forEach(x=>{map[x.id]=nid++});
  const cs=grp.map(x=>{const c=JSON.parse(JSON.stringify(x));c.id=map[x.id];c.parent=(x===o)?x.parent:map[x.parent];return c});
  const root=cs[grp.indexOf(o)];
  for(const k in root.keys){root.keys[k].x+=40;root.keys[k].y+=40}
  objects.push(...cs);sel=root.id;afterChange();
};
function zmove(d){
  const o=getSel();if(!o)return;
  const i=objects.indexOf(o),j=i+d;if(j<0||j>=objects.length)return;
  pushUndo();objects.splice(i,1);objects.splice(j,0,o);afterChange();
}
$('bUp').onclick=()=>zmove(1);
$('bDown').onclick=()=>zmove(-1);
$('bUngroup').onclick=()=>{
  const o=getSel();if(!o)return;
  pushUndo();
  detachChildren(o);
  const t=getW(o,cur);
  for(const st of o.strokes)draft.push({color:st.color,size:st.size*t.s,pts:st.pts.map(p=>{const w=toWorld(t,p[0],p[1]);return[w.x,w.y]})});
  objects=objects.filter(x=>x!==o);sel=null;
  setMode('draw');afterChange();
};
$('bDelObj').onclick=()=>{
  const o=getSel();if(!o)return;
  pushUndo();
  if(objects.some(c=>c.parent===o.id&&c.rig))objects=objects.filter(x=>!inChain(o,x.id));
  else{detachChildren(o);objects=objects.filter(x=>x!==o)}

};
function detachChildren(o){for(const c of objects.filter(x=>x.parent===o.id))reparent(c,null)}
$('bLink').onclick=()=>{

$('bDelKey').onclick=()=>{

function showMsg(t){const m=$('msg');m.textContent=t;m.style.display=t?'flex':'none'}
$('bExport').onclick=async()=>{
  if(playing)stopPlay();
  if(!window.MediaRecorder){alert('Is browser mein video export nahi hota. Chrome use karein.');return}
  showMsg('Video ban rahi hai... thoda ruko');
  try{
    const ec=document.createElement('canvas');ec.width=W;ec.height=H;
    const ex=ec.getContext('2d');
    drawScene(ex,0,false);
    const stream=ec.captureStream(fps);
    const mt=['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
    const isMp4=!!mt&&mt.indexOf('video/mp4')===0;
    const rec=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:5000000}:{});
    const chunks=[];
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    const done=new Promise(r=>rec.onstop=r);
    rec.start();
    for(let f=0;f<total;f++){
      drawScene(ex,f,false);
      showMsg('Video ban rahi hai... '+(f+1)+' / '+total);
      await sleep(1000/fps);
    }
    await sleep(1000/fps);
    rec.stop();await done;
    const blob=new Blob(chunks,{type:isMp4?'video/mp4':'video/webm'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=isMp4?'animation.mp4':'animation.webm';
    document.body.appendChild(a);a.click();a.remove();
    showMsg((isMp4?'MP4 video save ho gayi (Downloads mein).':'Is phone ka Chrome MP4 nahi banata, isliye WebM video save hui (Downloads mein).')+' Editing app mein Chroma Key se green hata sakte hain.');
    await sleep(3200);
  }catch(err){alert('Export mein error: '+err.message)}
  showMsg('');
};

/* ---------- auto save (offline, phone ke andar) ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('animator4',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
let st;
function save(){
  clearTimeout(st);
  st=setTimeout(async()=>{
    try{
      const d=await idb();
      d.transaction('s','readwrite').objectStore('s').put(JSON.stringify({fps,total,bg,smooth,objects,draft,nid},rnd),'p');
    }catch(e){}
  },600);
}
async function load(){
  try{
    const d=await idb();
    const r=await new Promise((res,rej)=>{const q=d.transaction('s').objectStore('s').get('p');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
    if(r){
      const s=JSON.parse(r);
      fps=s.fps||12;total=s.total||48;bg=s.bg||'#00b140';smooth=s.smooth!==false;
      objects=s.objects||[];draft=s.draft||[];nid=s.nid||1;
    }
  }catch(e){}
}

function buildChar(sp,x,y,f,id0){

  });
}

const stage=$('stage'),ptrs=new Map();
let gest=null,zoom=1,panX=0,panY=0;
function stageCenter(){const r=stage.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function applyView(){
  const w=cv.offsetWidth,h=cv.offsetHeight;
  if(zoom<=1.001){zoom=1;panX=0;panY=0}
  const mx=(zoom-1)*w/2+40,my=(zoom-1)*h/2+40;
  panX=Math.max(-mx,Math.min(mx,panX));panY=Math.max(-my,Math.min(my,panY));
  cv.style.transform=zoom===1?'':'translate('+panX+'px,'+panY+'px) scale('+zoom+')';
  render();
}
function zoomAt(cx,cy,f){
  const O=stageCenter(),q={x:(cx-O.x-panX)/zoom,y:(cy-O.y-panY)/zoom};
  zoom=Math.max(1,Math.min(4,zoom*f));
  panX=cx-O.x-zoom*q.x;panY=cy-O.y-zoom*q.y;applyView();
}
$('zIn').onclick=()=>{const O=stageCenter();zoomAt(O.x,O.y,1.4)};
$('zOut').onclick=()=>{const O=stageCenter();zoomAt(O.x,O.y,1/1.4)};
$('zFit').onclick=()=>{zoom=1;panX=0;panY=0;applyView()};
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)},{passive:false});
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('#zoomc'))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    if(drag&&drag.type==='draw'){draft=draft.filter(x=>x!==drag.st);undoS.pop()}
    drag=null;
    const v=[...ptrs.values()],a=v[0],b=v[1];
    gest={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:zoom,c0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},pan0:{x:panX,y:panY}};
    updateUI();render();
  }
},true);
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gest&&ptrs.size>=2){
    const v=[...ptrs.values()],a=v[0],b=v[1];
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1,c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const z1=Math.max(1,Math.min(4,gest.z0*d/gest.d0));
    const O=stageCenter(),q0={x:(gest.c0.x-O.x-gest.pan0.x)/gest.z0,y:(gest.c0.y-O.y-gest.pan0.y)/gest.z0};
    zoom=z1;panX=c.x-O.x-z1*q0.x;panY=c.y-O.y-z1*q0.y;applyView();
  }
});
function ptrEnd(e){ptrs.delete(e.pointerId);if(ptrs.size<2)gest=null}
stage.addEventListener('pointerup',ptrEnd,true);
stage.addEventListener('pointercancel',ptrEnd,true);

function walkCycle(cycles,per,spd,amp,lean,bob,bend){
  const q=per/4,n=Math.round(cycles*4),kf=[];
  const ph=[
    {thR:-.45*amp,shR:.05,thL:.4*amp,shL:.35*amp,uaL:-.45*amp,uaR:.45*amp,dy:0},
    {thR:-.05,shR:0,thL:-.15*amp,shL:.7*amp,uaL:0,uaR:0,dy:-bob},
    {thL:-.45*amp,shL:.05,thR:.4*amp,shR:.35*amp,uaR:-.45*amp,uaL:.45*amp,dy:0},
    {thL:-.05,shL:0,thR:-.15*amp,shR:.7*amp,uaL:0,uaR:0,dy:-bob}];
  for(let i=1;i<=n;i++){const p=ph[(i-1)%4];kf.push(K(Math.round(i*q),PS(Object.assign({torso:lean,faL:-bend,faR:-bend},p)),i*q*spd,p.dy))}
  const e=Math.round(n*q);kf.push(K(e+3,PS({}),e*spd+spd*1.5,0));
  return{len:e+3,kfs:kf};
}
function loopKF(beats,step,poses,dxs){
  const kf=[];for(let i=1;i<=beats;i++){const p=poses[(i-1)%poses.length];kf.push(K(i*step,PS(p),0,p.dy||0))}
  kf.push(K(beats*step+3,PS({}),0,0));return{len:beats*step+3,kfs:kf};
}

  {e:'👏',l:'Clap',make:r=>{const kf=[K(3,PS({uaL:-1.2,uaR:-1.2,faL:-.2,faR:-.2}),0,0)];for(let i=0;i<r*6;i++)kf.push(K(5+i*2,PS({uaL:-1.2,uaR:-1.2,faL:i%2?-.2:-1.3,faR:i%2?-.2:-1.3}),0,0));const e=5+r*12;kf.push(K(e+3,PS({}),0,0));return{len:e+3,kfs:kf}}},
  {e:'💃',l:'Dance',make:r=>loopKF(r*4,4,[{uaL:2.4,uaR:.3,faL:.3,faR:-1.2,thL:-.3,thR:.35,shL:.4,shR:.2,torso:.08,head:.1,dy:-6},{uaL:.3,uaR:-2.4,faL:-1.2,faR:-.3,thL:.35,thR:-.3,shL:.2,shR:.4,torso:-.08,head:-.1,dy:0}])},
  {e:'🕺',l:'Dance 2',make:r=>loopKF(r*4,3,[{uaL:-1.4,uaR:-2.6,faL:-.4,faR:-.3,thL:-.5,thR:.3,shL:.8,shR:.4,torso:.12,dy:14},{uaL:-2.6,uaR:-1.4,faL:-.3,faR:-.4,thL:.3,thR:-.5,shL:.4,shR:.8,torso:-.12,dy:14},{uaL:.8,uaR:-.8,faL:-1.4,faR:-1.4,thL:-.3,thR:-.3,shL:.5,shR:.5,torso:0,dy:4}])},
  {e:'🙇',l:'Bow',make:()=>({len:20,kfs:[K(6,PS({torso:.9,head:.35,uaL:.4,uaR:-.1}),0,0),K(13,PS({torso:.9,head:.35,uaL:.4,uaR:-.1}),0,0),K(20,PS({}),0,0)]})},
  {e:'🙌',l:'Cheer',make:r=>{const kf=[];for(let i=0;i<r*3;i++){kf.push(K(i*8+3,PS({uaL:2.7,uaR:-2.7,thL:-.5,thR:-.3,shL:.9,shR:.7}),0,-30),K(i*8+7,PS({uaL:2.5,uaR:-2.5,thL:.05,thR:-.05}),0,0))}kf.push(K(r*24+3,PS({}),0,0));return{len:r*24+3,kfs:kf}}},
  {e:'👉',l:'Point',make:()=>({len:20,kfs:[K(4,PS({uaR:-1.55,faR:0,head:.05}),0,0),K(16,PS({uaR:-1.55,faR:0,head:.05}),0,0),K(20,PS({}),0,0)]})},
  {e:'🪑',l:'Sit down',make:()=>({len:12,kfs:[K(12,PS(SITP),-8,56)]})},
  {e:'🧍',l:'Stand up',make:()=>({len:12,kfs:[K(12,PS({}),8,-56)]})},
  {e:'😴',l:'Sleep',make:()=>({len:14,kfs:[K(14,PS({torso:1.57,uaL:.1,uaR:-.1,faL:0,faR:0,thL:0,thR:0,shL:0,shR:0}),0,98)]})},
  {e:'⏰',l:'Wake up',make:()=>({len:14,kfs:[K(14,PS({torso:-1.57}),0,-98)]})},
  {e:'✍️',l:'Write',make:r=>{const kf=[K(4,PS({uaR:-1.25,faR:-.8,head:.25}),0,0)];for(let i=0;i<r*4;i++)kf.push(K(7+i*3,PS({uaR:i%2?-1.3:-1.15,faR:i%2?-.55:-1,head:.25}),0,0));const e=7+r*12;kf.push(K(e+4,PS({}),0,0));return{len:e+4,kfs:kf}}},
  {e:'👊',l:'Punch',make:()=>({len:14,kfs:[K(3,PS({uaR:.8,faR:-1.6,uaL:-.7,faL:-1.8,torso:-.05}),0,0),K(5,PS({uaR:-1.5,faR:-.1,uaL:-.7,faL:-1.8,torso:.2}),6,0),K(8,PS({uaR:-1.5,faR:-.1,uaL:-.7,faL:-1.8,torso:.2}),6,0),K(14,PS({}),0,0)]})},
  {e:'🥋',l:'Kick',make:()=>({len:15,kfs:[K(4,PS({thR:-.5,shR:1.2,torso:-.1,uaL:.5,uaR:-.5}),0,0),K(7,PS({thR:-1.6,shR:.1,torso:-.2,uaL:.9,uaR:-.9}),0,0),K(11,PS({thR:-.5,shR:1.2,torso:-.1}),0,0),K(15,PS({}),0,0)]})},
  {e:'🤕',l:'Fall down',make:()=>({len:12,kfs:[K(4,PS({torso:-.5,uaL:2,uaR:-2.2,thL:.2,thR:-.2}),-8,10),K(12,PS({torso:-1.45,uaL:1.4,uaR:-1.6,thL:.1,thR:-.1}),-30,90)]})},
  TURN];
const gait=(cycles,per,spd,amp,bob)=>{
  const q=per/4,n=Math.round(cycles*4),kf=[];
  const A={legFR:-.5*amp,legBL:-.5*amp,legFL:.5*amp,legBR:.5*amp},B={legFR:.5*amp,legBL:.5*amp,legFL:-.5*amp,legBR:-.5*amp};
  for(let i=1;i<=n;i++){const p=i%4===1?A:i%4===3?B:{};kf.push(K(Math.round(i*q),Object.assign({tail:i%2?.2:-.2,body:0},p),i*q*spd,i%2?-bob:0))}
  const e=Math.round(n*q);kf.push(K(e+3,{},e*spd+spd,0));return{len:e+3,kfs:kf};
};
const A_QUAD=[
  {e:'🐾',l:'Walk →',face:1,make:r=>gait(r*3,12,7,1,3)},{e:'🐾',l:'← Walk back',face:-1,make:r=>gait(r*3,12,7,1,3)},
  {e:'🐎',l:'Run →',face:1,make:r=>gait(r*4,8,22,1.8,8)},{e:'🐎',l:'← Run back',face:-1,make:r=>gait(r*4,8,22,1.8,8)},
  {e:'🦘',l:'Jump',make:r=>{const kf=[];for(let i=0;i<r;i++){const b=i*16;kf.push(K(b+4,{legFL:.8,legFR:.8,legBL:-.5,legBR:-.5,head:.2},0,10),K(b+8,{legFL:-.9,legFR:-.9,legBL:.9,legBR:.9,head:-.3},0,-80),K(b+12,{legFL:-.4,legFR:-.4,legBL:.4,legBR:.4},0,-60))}kf.push(K(r*16+2,{},0,0));return{len:r*16+2,kfs:kf}}},
  {e:'🐕',l:'Happy (tail wag)',make:r=>{const kf=[];for(let i=0;i<r*8;i++)kf.push(K(i*2+2,{tail:i%2?.7:-.7,head:i%2?-.1:.1},0,0));kf.push(K(r*16+4,{},0,0));return{len:r*16+4,kfs:kf}}},
  {e:'🍽️',l:'Eat',make:r=>{const kf=[K(4,{head:.9},0,0)];for(let i=0;i<r*3;i++)kf.push(K(6+i*3,{head:i%2?.7:1},0,0));kf.push(K(r*9+10,{},0,0));return{len:r*9+10,kfs:kf}}},
  TURN];
const flapKF=(role,role2,spd,len,amp)=>{const kf=[];for(let i=1;i<=len/2;i++){const o={};o[role]=i%2?-amp:amp*.8;if(role2)o[role2]=-o[role];kf.push(K(i*2,o,i*2*spd,Math.sin(i)*14))}kf.push(K(len+2,{},len*spd+spd*2,0));return{len:len+2,kfs:kf}};
const A_BIRD=[{e:'🕊️',l:'Fly →',face:1,make:r=>flapKF('wing',0,16,16*r,.9)},{e:'🕊️',l:'← Fly back',face:-1,make:r=>flapKF('wing',0,16,16*r,.9)},TURN];
const A_FLY=[{e:'🦋',l:'Fly →',face:1,make:r=>flapKF('wingA','wingB',8,16*r,.8)},{e:'🦋',l:'← Fly back',face:-1,make:r=>flapKF('wingA','wingB',8,16*r,.8)},TURN];
const A_FISH=[{e:'🐟',l:'Swim →',face:1,make:r=>flapKF('tail',0,8,24*r,.45)},{e:'🐟',l:'← Swim back',face:-1,make:r=>flapKF('tail',0,8,24*r,.45)},TURN];
const driveKF=(r,ctx)=>{const len=18*r,rad=ctx.rad||26,kf=[];for(let i=1;i<=len/3;i++){const f=i*3,d=f*14;kf.push(K(f,{},d,i%2?-2:0,{spin:d/rad}))}return{len:len,kfs:kf}};
const A_VEH=[{e:'🚗',l:'Go →',face:1,make:driveKF},{e:'🚗',l:'← Go back',face:-1,make:driveKF},
  {e:'⬆️',l:'Move up',make:r=>({len:18*r,kfs:[K(18*r,{},0,-14*18*r)]})},{e:'⬇️',l:'Move down',make:r=>({len:18*r,kfs:[K(18*r,{},0,14*18*r)]})},
  {e:'🔔',l:'Bounce',make:r=>{const kf=[];for(let i=0;i<r*2;i++)kf.push(K(i*6+3,{},0,-25),K(i*6+6,{},0,0));return{len:r*12,kfs:kf}}},TURN];
const objGo=(dx,dy)=>r=>({len:18*r,kfs:[K(18*r,{},dx*18*r,dy*18*r)]});
const A_OBJ=[
  {e:'➡️',l:'Move right',make:objGo(14,0)},{e:'⬅️',l:'Move left',make:objGo(-14,0)},{e:'⬆️',l:'Move up',make:objGo(0,-14)},{e:'⬇️',l:'Move down',make:objGo(0,14)},
  {e:'🔔',l:'Bounce',make:r=>{const kf=[];for(let i=0;i<r*2;i++)kf.push(K(i*6+3,{},0,-50),K(i*6+6,{},0,0));return{len:r*12,kfs:kf}}},
  {e:'🌀',l:'Spin',make:r=>{const kf=[];for(let i=1;i<=r*4;i++)kf.push(K(i*3,{},0,0,{dr:i*1.5708}));return{len:r*12,kfs:kf}}},
  {e:'🫨',l:'Shake',make:r=>{const kf=[];for(let i=1;i<=r*8;i++)kf.push(K(i*2,{},i%2?8:-8,0,{dr:i%2?.1:-.1}));kf.push(K(r*16+2,{},0,0));return{len:r*16+2,kfs:kf}}},
  {e:'⏱️',l:'Swing',make:r=>{const kf=[];for(let i=1;i<=r*4;i++)kf.push(K(i*5,{},0,0,{dr:i%2?.45:-.45}));kf.push(K(r*20+5,{},0,0));return{len:r*20+5,kfs:kf}}},
  {e:'🔍',l:'Grow',make:()=>({len:12,kfs:[K(12,{},0,0,{ds:1.6})]})},{e:'🔎',l:'Shrink',make:()=>({len:12,kfs:[K(12,{},0,0,{ds:.6})]})},TURN];
const ACTS={char:A_CHAR,quad:A_QUAD,bird:A_BIRD,butterfly:A_FLY,fish:A_FISH,vehicle:A_VEH,obj:A_OBJ};
const KINDNAME={char:'Character',quad:'Janwar',bird:'Parinda',butterfly:'Titli',fish:'Machhli',vehicle:'Gaadi',obj:'Object'};
function subRig(root){return objects.filter(o=>o===root||(o.rig&&inChain(root,o.id)))}
function roleMap(root){const m={};subRig(root).forEach(o=>{m[o.role||'root']=o});return m}
function syncLen(){
  const s2=$('len');
  if(![...s2.options].some(o=>+o.value===total)){const op=document.createElement('option');op.value=total;op.textContent=total+' frames';s2.appendChild(op)}
  s2.value=total;
}
function ensureTotal(n){if(n<=total)return;total=Math.min(600,Math.ceil(n/12)*12);syncLen()}
function applyAction(A,rep){
  let o=getSel();
  if(!o){const rs=objects.filter(x=>!x.parent);if(rs.length===1)o=rs[0]}
  if(!o)return;
  const root=rootOf(o),kind=root.kind||'obj',m=roleMap(root),rest=REST[kind]||{};
  if(playing)stopPlay();
  pushUndo();
  const f0=cur,rigK=kind!=='obj';
  for(const r in m){const ob=m[r],t=getT(ob,f0),k={x:t.x,y:t.y,r:t.r,s:t.s};if(ob===root)k.fx=t.fx||1;ob.keys[f0]=k}
  let fx=root.keys[f0].fx||1;
  const setFx=v=>{for(const k of Object.keys(root.keys))if(+k>=f0)root.keys[k].fx=v;fx=v};
  if(A.turn){setFx(-fx);afterChange();return}
  if(A.face&&A.face!==fx)setFx(A.face);
  const spec=A.make(rep,{rad:(m.wheelF||m.wheelB||{}).rad});
  const end=f0+spec.len;
  for(const r in m){const ob=m[r];for(const k of Object.keys(ob.keys))if(+k>f0&&+k<=end)delete ob.keys[k]}
  const scl=rigK?(root.keys[f0].s||1):1;
  for(const kf of spec.kfs){
    const f=f0+kf.f,d=kf.d||{};
    for(const r in m){
      const ob=m[r],t0=ob.keys[f0];let key;
      if(ob===root)key={x:t0.x+(kf.dx||0)*(rigK?fx:1)*scl,y:t0.y+(kf.dy||0)*scl,r:t0.r+(rigK?(d[r]||0)*fx:(kf.dr||0)),s:t0.s*(kf.ds||1),fx:fx};
      else if(r.indexOf('wheel')===0)key={x:t0.x,y:t0.y,r:t0.r+(kf.spin||0),s:t0.s};
      else key={x:t0.x,y:t0.y,r:d[r]!==undefined?d[r]:(rest[r]||0),s:t0.s};
      ob.keys[f]=key;
    }
  }
  ensureTotal(end+1);
  cur=f0;afterChange();startPlay();
}

/* ---------- Objects + Actions menus ---------- */
const LIBTABS=[['nature','🌳 Nature'],['city','🏠 City'],['vehicles','🚗 Vehicles'],['animals','🐶 Animals'],['indoor','🪑 Indoor'],['bg','🎨 Background']];
let libTab='nature';const thumbL=new Map();
function thumbItem(it){
  const c=document.createElement('canvas');c.width=120;c.height=104;
  const g=c.getContext('2d');g.fillStyle='#e8eaf6';g.fillRect(0,0,120,104);
  const saved=objects;
  try{
    objects=assemble(it.fn(),0,0,0,1,it.kind);
    let a=1e9,b=1e9,cc=-1e9,d=-1e9;
    for(const o of objects){const t=getW(o,0);for(const st of o.strokes)for(const p of st.pts){const w=toWorld(t,p[0],p[1]);a=Math.min(a,w.x);b=Math.min(b,w.y);cc=Math.max(cc,w.x);d=Math.max(d,w.y)}}
    const k=Math.min(100/Math.max(cc-a,1),84/Math.max(d-b,1),1);
    g.save();g.translate(60-(a+cc)/2*k,52-(b+d)/2*k);g.scale(k,k);
    for(const o of objects)drawObj(g,o,0);
    g.restore();
  }finally{objects=saved}
  return c;
}
function buildLib(){
  const tb=$('ltabs');tb.innerHTML='';
  LIBTABS.forEach(t=>{const b=document.createElement('button');b.textContent=t[1];b.className=t[0]===libTab?'on':'';b.onclick=()=>{libTab=t[0];buildLib()};tb.appendChild(b)});
  const gr=$('lgrid');gr.innerHTML='';
  if(libTab==='bg'){BGS.forEach(b=>{const d=document.createElement('div');d.className='bgs';d.style.background=b.c;d.textContent=b.n;d.onclick=()=>{bg=b.c;$('bg').value=b.c;render();save();$('lib').classList.remove('show')};gr.appendChild(d)});return}
  LIB.forEach((it,i)=>{
    if(it.cat!==libTab)return;
    const b=document.createElement('div');b.className='ch';
    let cv2=thumbL.get(i);if(!cv2){cv2=thumbItem(it);thumbL.set(i,cv2)}
    b.appendChild(cv2);const l=document.createElement('div');l.className='nm';l.textContent=it.name;b.appendChild(l);
    b.onclick=()=>pickItem(i);gr.appendChild(b);
  });
}
function pickItem(i){
  const it=LIB[i];$('lib').classList.remove('show');
  if(playing)stopPlay();
  pushUndo();
  const n=objects.filter(o=>!o.parent).length,OFF=[0,-260,260,-130,130,-380,380];
  const y=it.air?160:(it.y||482);
  const parts=assemble(it.fn(),W/2+(it.fixedX?0:OFF[n%7]),y,cur,nid,it.kind);
  nid+=parts.length;
  if(it.z==='back')objects.unshift(...parts);else objects.push(...parts);
  sel=parts.find(p=>!p.parent).id;setMode('move');afterChange();
}
$('bProps').onclick=()=>{if(playing)stopPlay();buildLib();$('lib').classList.add('show')};
$('lbClose').onclick=()=>$('lib').classList.remove('show');
$('lib').addEventListener('click',e=>{if(e.target===$('lib'))$('lib').classList.remove('show')});
function buildActs(){
  let o=getSel();if(!o){const rs=objects.filter(x=>!x.parent);if(rs.length===1)o=rs[0]}
  const g=$('agrid');g.innerHTML='';
  if(!o){$('anote').textContent='Pehle 👆 Move dabakar koi character ya object chhoo kar select karein.';return}
  const kind=rootOf(o).kind||'obj';
  $('anote').textContent='Target: '+KINDNAME[kind]+'. Action current frame ('+(cur+1)+') se shuru hoga.';
  (ACTS[kind]||ACTS.obj).forEach(A=>{
    const b=document.createElement('div');b.className='ab';b.textContent=A.e+' '+A.l;
    b.onclick=()=>{$('acts').classList.remove('show');applyAction(A,+$('rep').value)};g.appendChild(b);
  });
}
$('bActs').onclick=()=>{if(playing)stopPlay();buildActs();$('acts').classList.add('show')};
$('acClose2').onclick=()=>$('acts').classList.remove('show');
$('acts').addEventListener('click',e=>{if(e.target===$('acts'))$('acts').classList.remove('show')});
$('bTurn').onclick=()=>{if(getSel())applyAction(TURN,1)};

/* ---------- start ---------- */
function fit(){
  const s=$('stage');
  const r=Math.min((s.clientWidth-12)/W,(s.clientHeight-12)/H);
  cv.style.width=Math.max(50,Math.floor(W*r))+'px';cv.style.height=Math.max(28,Math.floor(H*r))+'px';
}
addEventListener('resize',()=>{fit();render()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
(async()=>{
  await load();
  $('fps').value=fps;syncLen();$('bg').value=bg;
  $('bSmooth').classList.toggle('on',smooth);
  markSw();fit();updateUI();render();
})();
</script>
